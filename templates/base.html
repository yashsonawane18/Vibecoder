<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Academic Doubt Forum{% endblock %}</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col font-sans antialiased">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <a href="/" class="flex items-center gap-2 text-xl font-extrabold text-indigo-700 tracking-tight">
            <span class="text-2xl">🎓</span>
            <span>Academic Doubt Forum</span>
          </a>
        </div>
        
        <div class="hidden sm:flex sm:items-center sm:space-x-6">
          <a href="/" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-lg text-sm font-semibold transition-colors">
            🏠 Feed
          </a>
          <a href="/leaderboard" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-1.5">
            <span>🏆</span> Mentor Leaderboard
          </a>
          <a href="/docs" target="_blank" class="text-xs bg-gray-100 text-gray-600 hover:bg-gray-200 px-2.5 py-1 rounded-md font-mono transition-colors">
            API Docs
          </a>
        </div>

        <!-- Mobile button -->
        <div class="flex items-center sm:hidden">
          <button id="mobile-menu-btn" class="p-2 rounded-md text-gray-500 hover:bg-gray-100">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden sm:hidden border-t px-4 pt-2 pb-3 space-y-1 bg-white">
      <a href="/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50">🏠 Feed</a>
      <a href="/leaderboard" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50">🏆 Mentor Leaderboard</a>
      <a href="/docs" class="block px-3 py-2 rounded-md text-base font-medium text-gray-500 hover:bg-gray-50">API Docs</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t py-6 text-center text-xs text-gray-500">
    <p>Academic Doubt Forum &bull; Powered by Python FastAPI, Google Gemini API & ReportLab</p>
  </footer>

  <!-- App Vanilla JS (Audio Web Speech API & Modals) -->
  <script src="/static/js/app.js"></script>
</body>
</html>
